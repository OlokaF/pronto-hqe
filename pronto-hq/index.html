<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pronto HQ — Marketing Ops</title>
  <link rel="icon" type="image/png" href="assets/pronto-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: "ProximaNova Black";
      src: url("assets/ProximaNova-Black.ttf") format("truetype");
      font-weight: 900;
      font-display: swap;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    html,body,#root{height:100%;}
    body{
      background:#FFFFFF;
      color:#0F1B3A;
      font-family:'Outfit', system-ui, sans-serif;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }
    ::-webkit-scrollbar{width:7px;height:7px;}
    ::-webkit-scrollbar-track{background:transparent;}
    ::-webkit-scrollbar-thumb{background:#D4D4CE;border-radius:4px;}
    ::-webkit-scrollbar-thumb:hover{background:#9AA0AE;}
    select option{background:#FFFFFF;color:#0F1B3A;}
    input::placeholder{color:#9AA0AE;}
    input:focus{outline:none;}
    button{font-family:inherit;}
  </style>
  <style>
    @media (max-width: 768px) {
      /* Scrollable tab bar */
      .tab-bar { overflow-x: auto; -webkit-overflow-scrolling: touch; flex-wrap: nowrap !important; }
      .tab-bar::-webkit-scrollbar { display: none; }
      /* Reduce main padding */
      .main-content { padding: 16px 16px 60px !important; }
      /* Stack header */
      .app-header { padding: 12px 16px !important; }
    }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <!-- Firebase Realtime Database (compat SDK — no build step needed) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="views.jsx"></script>
  <script type="text/babel" src="content-cal.jsx"></script>
  <script type="text/babel" src="plan.jsx"></script>
  <script type="text/babel" src="team.jsx"></script>
  <script type="text/babel" src="resources.jsx"></script>
  <script type="text/babel" src="schedule.jsx"></script>
  <script type="text/babel" src="extras.jsx"></script>
  <script type="text/babel" src="sync.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
